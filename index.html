<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyBank </title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f1f4f8;
  color: #222;
}

header {
  background: #123c69;
  color: white;
  padding: 18px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header button {
  background: #e74c3c;
  border: none;
  color: white;
  padding: 9px 15px;
  border-radius: 5px;
  cursor: pointer;
}

.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 20px;
}

.balance-card {
  background: #123c69;
  color: white;
  padding: 30px;
  border-radius: 15px;
  margin-bottom: 25px;
}

.balance {
  font-size: 38px;
  margin-top: 15px;
}

.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 30px;
}

.action {
  background: white;
  padding: 25px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 2px 8px #ddd;
}

.action button {
  margin-top: 15px;
  padding: 10px 20px;
  border: none;
  background: #1769aa;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

.transactions {
  background: white;
  padding: 25px;
  border-radius: 10px;
}

.transaction {
  display: flex;
  justify-content: space-between;
  padding: 15px 0;
  border-bottom: 1px solid #ddd;
}

.deposit {
  color: green;
}

.withdrawal {
  color: red;
}

@media(max-width:700px) {
  .actions {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h2>MyBank</h2>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="balance-card">
    <p>Available Balance</p>
    <div class="balance" id="balance">R10,000.00</div>
    <p>Account: ** 4582</p>
  </div>

  <div class="actions">

    <div class="action">
      <h3>Deposit</h3>
      <p>Add money to your account.</p>
      <button onclick="deposit()">Deposit</button>
    </div>

    <div class="action">
      <h3>Withdraw</h3>
      <p>Withdraw money from your  account.</p>
      <button onclick="withdraw()">Withdraw</button>
    </div>

    <div class="action">
      <h3>Transfer</h3>
      <p>Transfer money to another account.</p>
      <button onclick="transfer()">Transfer</button>
    </div>

  </div>

  <div class="transactions">
    <h2>Recent Transactions</h2>

    <div id="transactionList">

      <div class="transaction">
        <span>Initial Balance</span>
        <span class="deposit">+ R10,000.00</span>
      </div>

    </div>
  </div>

</div>

<script>

let balance = 20000;

function updateBalance() {
  document.getElementById("balance").textContent =
    "R" + balance.toLocaleString("en-ZA", {
      minimumFractionDigits: 2
    });
}

function addTransaction(description, amount, type) {

  const transactionList =
    document.getElementById("transactionList");

  const transaction =
    document.createElement("div");

  transaction.className = "transaction";

  transaction.innerHTML = `
    <span>${description}</span>
    <span class="${type}">
      ${amount >= 0 ? "+" : "-"}
      R${Math.abs(amount).toFixed(2)}
    </span>
  `;

  transactionList.prepend(transaction);
}

function deposit() {

  const amount = Number(
    prompt("Enter deposit amount:")
  );

  if (!amount || amount <= 0) {
    alert("Enter a valid amount.");
    return;
  }

  balance += amount;

  addTransaction(
    "Deposit",
    amount,
    "deposit"
  );

  updateBalance();
}

function withdraw() {

  const amount = Number(
    prompt("Enter withdrawal amount:")
  );

  if (!amount || amount <= 0) {
    alert("Enter a valid amount.");
    return;
  }

  if (amount > balance) {
    alert("Insufficient funds.");
    return;
  }

  balance -= amount;

  addTransaction(
    "Withdrawal",
    -amount,
    "withdrawal"
  );

  updateBalance();
}

function transfer() {

  const account = prompt(
    "Enter recipient account number:"
  );

  if (!account) return;

  const amount = Number(
    prompt("Enter transfer amount:")
  );

  if (!amount || amount <= 0) {
    alert("Enter a valid amount.");
    return;
  }

  if (amount > balance) {
    alert("Insufficient funds.");
    return;
  }

  balance -= amount;

  addTransaction(
    "Transfer to **" + account.slice(-4),
    -amount,
    "withdrawal"
  );

  updateBalance();

  alert(" transfer completed.");
}

function logout() {
  alert("You have been logged out.");
}

updateBalance();

</script>

</body>
</html>
